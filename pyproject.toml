[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["automation_menu", "automation_menu.*"]

[project]
name = "automation-menu"
version = "2.4.0"
description = "Windows desktop application for automation script discovery and execution"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Smorkster", email = "smorkster@gmail.com"},
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: System Administrators",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: English",
    "Natural Language :: Swedish",
    "Topic :: System :: Systems Administration",
    "Topic :: System :: Systems Administration :: Authentication/Directory :: LDAP",
    "Topic :: Utilities"
]

keywords = [
    "active-directory",
    "automation",
    "desktop-gui",
    "gui",
    "it-admin",
    "ldap",
    "localization",
    "script-runner",
    "tkinter",
    "uiautomation",
    "windows",
]

dependencies = [
    "alwaysontop_tooltip>=1.3",
    "dynamicinputbox>=3.0",
    "ldap3==2.9.1",
    "outcome>=1.3.0.post0",
    "pillow>=12.2.0",
    "psutil>=7.2.2",
    "pywin32==311",
    "UiAutomation==2.0.29"
]
gui-scripts = {main = "main:main"}

[project.urls]
Homepage = "https://github.com/Smorkster/AutomationMenu"
Repository = "https://github.com/Smorkster/AutomationMenu"
Issues = "https://github.com/Smorkster/AutomationMenu/issues"
